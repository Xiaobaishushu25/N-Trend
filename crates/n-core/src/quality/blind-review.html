<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信号形态盲评</title>
<style>body{font:15px/1.5 system-ui;margin:0;background:#f2f5fa;color:#21304a}main{max-width:1500px;padding:24px;margin:auto}h1{font-size:24px}button,select,textarea{font:inherit;padding:9px;border:1px solid #bdcce0;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.4}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.panel{background:white;border:1px solid #dce3ec;border-radius:12px;padding:14px;min-width:0}.scroll{overflow-x:auto;height:460px}svg{flex:none}.task{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.hint{color:#5f718b}.feedback{color:#20746a}textarea{display:block;width:95%;height:60px;margin:14px 0}label{margin-right:12px}@media(max-width:850px){.charts{grid-template-columns:1fr}}</style>
<main><h1>信号形态盲评</h1><p class="hint">只展示截至预警收盘的行情。两侧每根K线宽度一致，纵坐标以ATR为单位；S0、S1、S2保留。形态判断完成后可显示入场、止损和S1空间，再评价综合条件。</p>
<div class="toolbar"><button id="prev">上一组</button><span id="position"></span><button id="next">下一组</button><button id="reveal">显示交易空间</button><button id="download">下载标签JSON</button></div>
<div class="charts"><div class="panel"><b>左侧</b><span id="ldir"></span><div class="scroll" id="left"></div><div id="lspace"></div></div><div class="panel"><b>右侧</b><span id="rdir"></span><div class="scroll" id="right"></div><div id="rspace"></div></div></div>
<div class="panel"><div class="task"><label>形态更喜欢哪个？ <select id="morphology"><option value="">请选择</option><option value="left">左侧</option><option value="right">右侧</option><option value="tie">相近</option><option value="uncertain">无法判断</option></select></label><label>综合条件更喜欢哪个？ <select id="opportunity"><option value="">请选择</option><option value="left">左侧</option><option value="right">右侧</option><option value="tie">相近</option><option value="uncertain">无法判断</option></select></label></div>
<div>主要原因：<label><input type="checkbox" value="trend">趋势</label><label><input type="checkbox" value="a">A段</label><label><input type="checkbox" value="b">B段</label><label><input type="checkbox" value="space">空间</label></div><textarea id="note" maxlength="2000" placeholder="可选补充说明"></textarea><button id="save">保存本组</button> <span class="feedback" id="message"></span></div></main>
<script type="application/json" id="payload">__BLIND_PAYLOAD__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('payload').textContent),storageKey='signal-quality-blind:'+data.manifest_hash;
let index=0,revealed=false,labels={};try{labels=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
function el(name,attrs,text){const n=document.createElementNS(NS,name);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n}
function draw(side,c){const container=$(side);container.replaceChildren();const bs=c.bars, width=Math.max(650,bs.length*8+80),height=450,svg=el('svg',{width,height,viewBox:`0 0 ${width} ${height}`});
 let low=Math.min(...bs.map(b=>b[2])),high=Math.max(...bs.map(b=>b[1]));if(revealed){low=Math.min(low,c.entry,c.stop,c.target);high=Math.max(high,c.entry,c.stop,c.target)}const span=Math.max(high-low,.5);low-=span*.12;high+=span*.12;const y=v=>20+(high-v)/(high-low)*390,x=i=>width-60-(bs.length-1-i)*8;
 for(let j=0;j<6;j++){const value=low+(high-low)*j/5,yy=y(value);svg.append(el('line',{x1:0,x2:width-50,y1:yy,y2:yy,stroke:'#e8edf5'}),el('text',{x:width-48,y:yy+4,fill:'#71829c','font-size':11},value.toFixed(1)+' ATR'))}
 const points=[];bs.forEach((b,i)=>{const col=b[3]>=b[0]?'#e55353':'#24a685';svg.append(el('line',{x1:x(i),x2:x(i),y1:y(b[1]),y2:y(b[2]),stroke:col}));svg.append(el('rect',{x:x(i)-2.6,y:Math.min(y(b[0]),y(b[3])),width:5.2,height:Math.max(1,Math.abs(y(b[0])-y(b[3]))),fill:b[3]>=b[0]?'white':col,stroke:col}));if(b[4]!=null)points.push(x(i)+','+y(b[4]))});svg.append(el('polyline',{points:points.join(' '),fill:'none',stroke:'#426cf1','stroke-width':1.5}));
 svg.append(el('polyline',{points:c.points.map(p=>x(p[0])+','+y(p[1])).join(' '),fill:'none',stroke:'#ed8a47','stroke-width':1.5}));c.points.forEach((p,i)=>{svg.append(el('circle',{cx:x(p[0]),cy:y(p[1]),r:3,fill:'#ed8a47'}),el('text',{x:x(p[0])-8,y:y(p[1])+(i===1?-12:20),'font-size':11,fill:'#935324'},'S'+i))});
 if(revealed)for(const [name,v,color]of [['入场',c.entry,'#2c68c6'],['止损',c.stop,'#df4d4d'],['S1',c.target,'#219767']])svg.append(el('line',{x1:0,x2:width-55,y1:y(v),y2:y(v),stroke:color,'stroke-dasharray':'3 3'}),el('text',{x:8,y:y(v)-5,fill:color,'font-size':12},name));
 container.append(svg);container.scrollLeft=container.scrollWidth;}
function render(preserve=false){const p=data.pairs[index];$('position').textContent=data.pairs.length?`${index+1} / ${data.pairs.length} · 已保存 ${Object.keys(labels).length} 组`:'没有足够样本生成成对比较';$('prev').disabled=index===0;$('next').disabled=index>=data.pairs.length-1;if(!p){$('save').disabled=true;return}draw('left',p.left);draw('right',p.right);$('ldir').textContent=p.left.direction==='up'?' · 做多':' · 做空';$('rdir').textContent=p.right.direction==='up'?' · 做多':' · 做空';$('lspace').textContent=revealed?'到S1的空间：'+p.left.rr.toFixed(2)+'R':'';$('rspace').textContent=revealed?'到S1的空间：'+p.right.rr.toFixed(2)+'R':'';if(!preserve){const saved=labels[p.pair_id];$('morphology').value=saved?.morphology||'';$('opportunity').value=saved?.opportunity||'';$('note').value=saved?.note||'';document.querySelectorAll('input[type=checkbox]').forEach(n=>n.checked=(saved?.reasons||[]).includes(n.value));$('message').textContent='';}}
$('prev').onclick=()=>{if(index){index--;revealed=false;render()}};$('next').onclick=()=>{if(index+1<data.pairs.length){index++;revealed=false;render()}};
$('reveal').onclick=()=>{revealed=!revealed;render(true)};
$('save').onclick=()=>{const p=data.pairs[index],m=$('morphology').value,o=$('opportunity').value;if(!m||!o){$('message').textContent='请完成两项选择，可选“无法判断”。';return}labels[p.pair_id]={pair_id:p.pair_id,left_case_id:p.left.case_id,right_case_id:p.right.case_id,left_input_hash:p.left.input_hash,right_input_hash:p.right.input_hash,morphology:m,opportunity:o,reasons:[...document.querySelectorAll('input:checked')].map(n=>n.value),note:$('note').value};try{localStorage.setItem(storageKey,JSON.stringify(labels))}catch{$('message').textContent='浏览器无法本地保存，请立即下载JSON。';return}render();$('message').textContent='已保存';};
$('download').onclick=()=>{const content={manifest_hash:data.manifest_hash,display_version:data.display_version,labels:Object.values(labels)},blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='signal-quality-preferences.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
