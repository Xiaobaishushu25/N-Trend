[package]
name = "n-core"
version.workspace = true
edition.workspace = true
description = "Core library for the n_trend_analyzer desktop client"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
encoding_rs = "0.8"
lettre = { version = "0.10", default-features = false, features = ["smtp-transport", "builder", "native-tls"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
toml = "0.8"
tracing = "0.1"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "v2-dataset"
path = "src/bin/v2_dataset.rs"

[[bin]]
name = "v2-train"
path = "src/bin/v2_train.rs"
