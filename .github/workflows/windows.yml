name: Build Windows NSIS Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release 标签（留空则自动读取 package.json 中的版本号，如 v3.0.0）'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
      - feat/mobile
      - 'feat/**'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Locate output installer & generate SHA-256
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path target/release/bundle/nsis -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $installers) {
            Write-Host "Warning: No .exe found directly in target/release/bundle/nsis, searching recursively in target..."
            $installers = Get-ChildItem -Path target -Recurse -Filter "*.exe" | Where-Object { $_.FullName -like "*bundle*nsis*" }
          }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($installer.Name)" | Out-File -FilePath "$($installer.FullName).sha256" -Encoding ascii
            Write-Host "Found installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
            Write-Host "SHA-256: $hash"
          }

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntrend-windows-nsis-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Resolve Release Tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        id: release_tag
        shell: pwsh
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $tag = '${{ github.ref_name }}'
          } elseif ('${{ inputs.tag_name }}' -ne '') {
            $tag = '${{ inputs.tag_name }}'
          } else {
            $pkg = Get-Content package.json | ConvertFrom-Json
            $tag = "v$($pkg.version)"
          }
          Write-Host "Resolved release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
